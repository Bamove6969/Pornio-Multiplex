[package]
name = "stremio_multiview_core"
version = "0.1.0"
edition = "2021"
authors = ["Stremio Multiview Team"]
description = "High-performance Rust backend for 4-screen Stremio multiview player"

[lib]
name = "stremio_multiview_core"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/rust/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros", "time"] }
futures = "0.3"
url = "2.5"
urlencoding = "2.1"
libc = "0.2"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
